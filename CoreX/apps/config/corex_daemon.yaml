# ============================================================================
# CoreX RPC Daemon 默认配置文件
# ============================================================================

# --- 服务器配置 ---
server:
  name: "CoreXDaemon"       # 服务器名称（用于日志和连接标识）
  host: "0.0.0.0"           # 监听地址（0.0.0.0 表示监听所有网卡）
  port: 8080                # TCP 监听端口
  worker_threads: 4         # IO 工作线程数（子 Reactor 数量）

# --- IPC 快速通道配置（本地共享内存通信，低延迟）---
ipc:
  enabled: true                       # 是否启用 IPC fast-path
  shm_name: "/corex_rpc_ipc"          # 共享内存段名称（客户端需一致）

# --- 插件配置 ---
plugins:
  directory: "./plugins"              # 插件 .so 文件搜索目录
  autoload: true                      # 启动时自动加载目录下所有 .so

# --- 日志配置 ---
logging:
  level: "INFO"                       # 日志级别: DEBUG, INFO, WARN, ERROR, FATAL
  path: "./log"                       # 日志文件输出目录
  # 注意: 日志功能需编译时启用 ENABLE_LOG=ON

# --- 监控配置 ---
monitoring:
  health_check_port: 9090             # HTTP 健康检查端口（预留，尚未实现）
  latency_stats: false                # 是否启用 RPC 延迟统计（预留）

# ============================================================================
# ROS Bridge 配置 — CoreX ↔ ROS 协议网关
# 注意：需要 ROS 环境 (roscore) 才能正常使用
# ============================================================================
ros_bridge:
  enabled: true                       # 是否启用 ROS Bridge（默认关闭，需在有 ROS 的机器上开启）
  node_name: "corex_ros_bridge"        # ROS 节点名称
  spinner_threads: 2                   # ROS AsyncSpinner 线程数

  # ★ 机器人标识（云端用此 ID 指定目标机器人）
  robot_id: "robot_001"

  # ★ ROS 消息类型注册表（YAML 驱动的 MD5/datatype 查询）
  # 新增消息类型只需在此添加条目，无需修改 C++ 源码
  # MD5 可通过命令获取: rosmsg md5 <消息类型>
  ros_message_types:
    geometry_msgs/Twist:
      md5: "9f3b76f2e8cdcf8e7a2e6f8b9c7e6d5f"
      datatype: "geometry_msgs/Twist"
    geometry_msgs/Vector3:
      md5: "4a842b65f413084dc2b10fb484ea7f17"
      datatype: "geometry_msgs/Vector3"

  # ★ 通用动作映射（云端发送抽象动作 → 自动映射为 ROS topic）
  # 新增动作只需在此添加条目 + ros_message_types 中对应类型
  generic_actions:
    - action: "move"
      ros_topic: "/cmd_vel"
      ros_type: "geometry_msgs/Twist"
      direction: "publish"
      fields:
        - field_number: 1       # Twist.linear (Vector3)
          type: "message"
          nested_fields:
            - field_number: 1   # Vector3.x
              type: "float64"
              param: "linear_x"
              default: "0.0"
            - field_number: 2   # Vector3.y
              type: "float64"
              param: "linear_y"
              default: "0.0"
            - field_number: 3   # Vector3.z
              type: "float64"
              param: "linear_z"
              default: "0.0"
        - field_number: 2       # Twist.angular (Vector3)
          type: "message"
          nested_fields:
            - field_number: 1
              type: "float64"
              param: "angular_x"
              default: "0.0"
            - field_number: 2
              type: "float64"
              param: "angular_y"
              default: "0.0"
            - field_number: 3
              type: "float64"
              param: "angular_z"
              default: "0.0"

    - action: "stop"
      ros_topic: "/cmd_vel"
      ros_type: "geometry_msgs/Twist"
      direction: "publish"
      fields:
        - field_number: 1
          type: "message"
          nested_fields:
            - field_number: 1
              type: "float64"
              default: "0.0"
            - field_number: 2
              type: "float64"
              default: "0.0"
            - field_number: 3
              type: "float64"
              default: "0.0"
        - field_number: 2
          type: "message"
          nested_fields:
            - field_number: 1
              type: "float64"
              default: "0.0"
            - field_number: 2
              type: "float64"
              default: "0.0"
            - field_number: 3
              type: "float64"
              default: "0.0"

  # Topic 双向映射（保留向后兼容）
  topics:
    # --- ROS → CoreX (subscribe) ---
    - ros_topic: "/odom"
      ros_type: "nav_msgs/Odometry"
      direction: "subscribe"
      rpc_service: "CoreX.rpc.RobotTelemetry"
      rpc_method: "GetOdometry"
      rate_hz: 20
      queue_size: 10

    - ros_topic: "/joint_states"
      ros_type: "sensor_msgs/JointState"
      direction: "subscribe"
      rpc_service: "CoreX.rpc.RobotTelemetry"
      rpc_method: "GetJointStates"
      rate_hz: 50
      queue_size: 10

    - ros_topic: "/camera/image_raw"
      ros_type: "sensor_msgs/Image"
      direction: "subscribe"
      rpc_service: "CoreX.rpc.RobotTelemetry"
      rpc_method: "GetImage"
      use_shm: true                    # 高频大数据走共享内存
      rate_hz: 30
      queue_size: 5

    - ros_topic: "/scan"
      ros_type: "sensor_msgs/LaserScan"
      direction: "subscribe"
      rpc_service: "CoreX.rpc.RobotTelemetry"
      rpc_method: "GetLaserScan"
      rate_hz: 10
      queue_size: 10

    # --- CoreX → ROS (publish) ---
    - ros_topic: "/cmd_vel"
      ros_type: "geometry_msgs/Twist"
      direction: "publish"
      rpc_service: "CoreX.rpc.MotionControl"
      rpc_method: "SetVelocity"
      queue_size: 10

    - ros_topic: "/cmd_vel_mux/external"
      ros_type: "geometry_msgs/Twist"
      direction: "publish"
      rpc_service: "CoreX.rpc.MotionControlMux"
      rpc_method: "SetVelocity"
      queue_size: 10

  # ROS Service 映射
  services:
    # - ros_service: "/gazebo/spawn_model"
    #   rpc_service: "CoreX.rpc.SimulationControl"
    #   rpc_method: "SpawnModel"
    #   timeout_ms: 5000

    # - ros_service: "/controller_manager/switch_controller"
    #   rpc_service: "CoreX.rpc.ControllerManager"
    #   rpc_method: "SwitchController"
    #   timeout_ms: 3000

  # ROS Action 映射
  actions:
